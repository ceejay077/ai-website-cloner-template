[build.environment]
  # Neither value is secret, so secrets scanning would otherwise fail the build:
  # - ENQUIRY_EMAIL_TO is the public contact address shown in the site footer.
  # - ADMIN_TIMEZONE matches the "Asia/Colombo" default in src/lib/server/db.ts.
  # - SITE_URL is the public site address, which appears in every page, the sitemap and robots.txt.
  SECRETS_SCAN_OMIT_KEYS = "ENQUIRY_EMAIL_TO,ADMIN_TIMEZONE,SITE_URL"
